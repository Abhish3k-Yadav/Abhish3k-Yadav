<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution snake placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0B1633"/>
    </linearGradient>
    <linearGradient id="snake" x1="200" y1="120" x2="1380" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="none"/>
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22D3EE" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#8B5CF6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>
  <text x="92" y="90" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Contribution grid</text>
  <text x="92" y="128" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Snake asset placeholder committed locally for reliability.</text>
  <g filter="url(#glow)">
    <path d="M180 288C278 246 358 246 438 208C526 166 620 120 744 120C870 120 938 172 1044 172C1146 172 1220 134 1322 96" stroke="url(#snake)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="28 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="1322" cy="96" r="16" fill="#E2E8F0" fill-opacity="0.9"/>
    <circle cx="1322" cy="96" r="6" fill="#050816"/>
    <circle cx="438" cy="208" r="9" fill="#E2E8F0" fill-opacity="0.8"/>
    <circle cx="744" cy="120" r="9" fill="#E2E8F0" fill-opacity="0.8"/>
  </g>
</svg>