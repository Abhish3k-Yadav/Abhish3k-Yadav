<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyber header for Abhishek Yadav profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.45" stop-color="#0B1633"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="70" x2="1380" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#8B5CF6" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 H 0 V 50" stroke="#94A3B8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="32" fill="url(#grid)"/>

  <g opacity="0.75">
    <circle cx="160" cy="90" r="2" fill="#7DD3FC">
      <animate attributeName="cy" values="90;76;90" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="280" r="2" fill="#A78BFA">
      <animate attributeName="cy" values="280;260;280" dur="5.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="5.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1350" cy="110" r="2" fill="#22D3EE">
      <animate attributeName="cy" values="110;95;110" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1410" cy="310" r="2" fill="#38BDF8">
      <animate attributeName="cy" values="310;294;310" dur="5.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#shadow)">
    <path d="M194 296C300 220 418 182 566 182C718 182 835 226 962 226C1108 226 1214 166 1384 120" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M184 298C294 210 416 164 566 164C722 164 840 212 962 212C1102 212 1220 158 1384 112" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="130" y="86" width="310" height="196" rx="28" fill="#0B1224" fill-opacity="0.82" stroke="#60A5FA" stroke-opacity="0.26"/>
    <rect x="162" y="120" width="166" height="18" rx="9" fill="#E2E8F0" fill-opacity="0.88"/>
    <rect x="162" y="154" width="236" height="12" rx="6" fill="#94A3B8" fill-opacity="0.55"/>
    <rect x="162" y="178" width="210" height="12" rx="6" fill="#94A3B8" fill-opacity="0.38"/>
    <rect x="162" y="202" width="190" height="12" rx="6" fill="#94A3B8" fill-opacity="0.28"/>
    <rect x="162" y="232" width="122" height="34" rx="17" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle cx="382" cy="120" r="42" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="382" cy="120" r="16" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M376 120H388M382 114V126" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <text x="540" y="165" fill="url(#glow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="0.5">Abhishek Yadav</text>
    <text x="542" y="214" fill="#C7D2FE" fill-opacity="0.88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Software Engineer • Full Stack Developer • AI Enthusiast</text>
    <text x="542" y="256" fill="#93C5FD" fill-opacity="0.82" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Building clean interfaces, scalable systems, and premium product experiences.</text>
  </g>

  <g opacity="0.9">
    <rect x="1040" y="86" width="390" height="196" rx="28" fill="#08111F" fill-opacity="0.85" stroke="#A78BFA" stroke-opacity="0.22"/>
    <text x="1076" y="132" fill="#F8FAFC" font-family="SFMono-Regular, Consolas, monospace" font-size="18">&gt; loading profile_identity</text>
    <text x="1076" y="164" fill="#7DD3FC" font-family="SFMono-Regular, Consolas, monospace" font-size="18">&gt; aligning product_thinking</text>
    <text x="1076" y="196" fill="#C4B5FD" font-family="SFMono-Regular, Consolas, monospace" font-size="18">&gt; connecting github_signals</text>
    <text x="1076" y="228" fill="#86EFAC" font-family="SFMono-Regular, Consolas, monospace" font-size="18">&gt; optimizing for recruiter scan</text>
    <text x="1076" y="260" fill="#E2E8F0" font-family="SFMono-Regular, Consolas, monospace" font-size="18">&gt; ready</text>
    <rect x="1218" y="246" width="42" height="3" rx="1.5" fill="#E2E8F0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
