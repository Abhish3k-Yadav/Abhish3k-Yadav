<svg width="1600" height="240" viewBox="0 0 1600 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal shutdown footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1633"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="beam" x1="260" y1="170" x2="1340" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="240" rx="30" fill="url(#bg)"/>
  <path d="M140 164C296 120 422 94 602 94C802 94 946 146 1138 146C1266 146 1370 118 1460 92" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="7s" repeatCount="indefinite"/>
  </path>
  <rect x="128" y="66" width="468" height="112" rx="22" fill="#08111F" fill-opacity="0.88" stroke="#93C5FD" stroke-opacity="0.16"/>
  <text x="164" y="112" fill="#E2E8F0" font-family="SFMono-Regular, Consolas, monospace" font-size="24">terminal.shutting_down()</text>
  <text x="164" y="146" fill="#7DD3FC" font-family="SFMono-Regular, Consolas, monospace" font-size="20">saving state... syncing ideas... done.</text>
  <rect x="468" y="128" width="70" height="4" rx="2" fill="#E2E8F0">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1298" cy="120" r="34" fill="#0B1224" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M1290 108L1310 120L1290 132V108Z" fill="#22D3EE"/>
  <text x="1194" y="188" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Built to feel calm, sharp, and fast.</text>
</svg>