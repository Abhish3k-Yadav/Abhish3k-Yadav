    <text x="70" y="132" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Balanced across product, platform, and polish.</text>
    <text x="70" y="184" fill="#7DD3FC" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Java  React  Next.js  Node.js  TypeScript</text>
    <text x="70" y="214" fill="#C4B5FD" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Spring Boot  SQL  Docker  Kubernetes  AWS</text>
    <text x="70" y="244" fill="#86EFAC" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Git  Linux  Figma  Postman  AI tooling</text>
