<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack radar card">
  <defs>
    <radialGradient id="radarGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 170) rotate(90) scale(170 600)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="300" y1="60" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="1196" height="336" rx="28" fill="#07111F" stroke="#93C5FD" stroke-opacity="0.18"/>
  <rect x="30" y="30" width="1140" height="276" rx="22" fill="url(#radarGlow)"/>
  <g opacity="0.8">
    <circle cx="600" cy="170" r="40" stroke="#A78BFA" stroke-opacity="0.26" stroke-width="2"/>
    <circle cx="600" cy="170" r="88" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="600" cy="170" r="136" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="600" cy="170" r="184" stroke="#E2E8F0" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M600 26V314M454 170H746M495 75L705 265M705 75L495 265" stroke="#E2E8F0" stroke-opacity="0.12"/>
    <path d="M600 170L740 84" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 600 170" to="360 600 170" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
