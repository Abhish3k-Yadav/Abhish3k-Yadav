name: Validate Profile Assets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate README references and SVG integrity
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          readme = (root / 'README.md').read_text(encoding='utf-8')

          referenced_paths = set()
          for match in re.finditer(r'(?:src|href)="([^"]+)"', readme):
              path = match.group(1)
              if path.startswith(('http://', 'https://', 'mailto:')):
                  continue
              if path.startswith('#'):
                  continue
              referenced_paths.add(path)

          for path in sorted(referenced_paths):
              resolved = (root / path).resolve()
              if not resolved.exists():
                  raise SystemExit(f'Missing referenced file: {path}')

          for svg_path in list((root / 'assets' / 'svg').glob('*.svg')) + list((root / 'output').glob('*.svg')):
              ET.parse(svg_path)
          print(f'Validated {len(referenced_paths)} local README references and SVG syntax.')
          PY
          test -f output/github-contribution-grid-snake-dark.svg
